name: Bug report
description: Report a parsing issue, false positive, or missed compatibility mismatch
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior or incorrect diagnostic code.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Paste the chrcheck command and minimal header/snippet (`.fai`, `.dict`, VCF `##contig`, or BED lines).
      placeholder: |
        chrcheck a.bam b.bed
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "chrcheck 0.1.0, Python 3.12, Ubuntu 24.04"
    validations:
      required: true
