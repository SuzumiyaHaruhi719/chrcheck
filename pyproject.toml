[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chrcheck"
version = "0.1.0"
description = "Genome build and chromosome naming preflight CLI for BAM, VCF, BED, GTF, and FASTA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  {name = "SuzumiyaHaruhi719"}
]
keywords = ["bioinformatics", "genomics", "vcf", "bam", "bed", "gtf", "chromosome", "reference-genome", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SuzumiyaHaruhi719/chrcheck"
Repository = "https://github.com/SuzumiyaHaruhi719/chrcheck"
Issues = "https://github.com/SuzumiyaHaruhi719/chrcheck/issues"
Changelog = "https://github.com/SuzumiyaHaruhi719/chrcheck/blob/main/CHANGELOG.md"

[project.scripts]
chrcheck = "chrcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
